# デスクトップ版のビルドと確認。
#
# - linux:   テスト（PostgreSQL を一緒に立てる）と、Linux 向けのデスクトップ版の起動確認
# - windows: Windows 用のデスクトップ版を作る（.zip のフォルダ版と .msi インストーラー）
#            できたものは、Actions の実行結果ページ下の「Artifacts」からダウンロードできる
#
# 同梱する Java は「21 系の最新のパッチ版（Temurin）」。古い版に固定しないよう
# setup-java の check-latest を使っている（JRE の脆弱性対策のため）。
name: Desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: テストと Linux での起動確認
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: company_directory
          POSTGRES_PASSWORD: ci-only-password # CI の中だけで使う使い捨ての DB
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/company_directory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ci-only-password
      HOJIN_BANGOU_APP_ID: dummy
      GEMINI_API_KEY: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true
      - uses: gradle/actions/setup-gradle@v5
      - name: ビルドとテスト
        run: ./gradlew build
      - name: Linux 向けのデスクトップ版を作る
        run: ./gradlew desktopAppImage
      - name: 起動を確かめる（2 回起動して、CDS で速くなるかも見る）
        run: |
          mkdir -p "$RUNNER_TEMP/cd-home"
          # このジョブの env にある DB を使うので .env は空でよい
          touch "$RUNNER_TEMP/cd-home/.env"
          packaging/ci/smoke-test.sh build/desktop/dist/CompanyDirectory "$RUNNER_TEMP/cd-home"
      - name: テスト結果（失敗したとき用）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-reports
          path: build/reports/
          if-no-files-found: ignore

  windows:
    name: Windows 用のデスクトップ版を作る
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # 例: 1.0.42。インストーラーは版が上がらないと上書きできないので、実行番号を使う
      DESKTOP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true
      - uses: gradle/actions/setup-gradle@v5
      - name: 同梱する Java の版を記録する
        shell: bash
        run: |
          java -version 2>&1 | tee java-version.txt
      - name: フォルダ版を作る（jpackage --type app-image）
        shell: bash
        run: ./gradlew desktopAppImage "-PdesktopVersion=$DESKTOP_VERSION"

      # ---- 動作確認: ランナーに入っている PostgreSQL を使って、本当に起動するかを見る ----
      - name: 確認用の PostgreSQL を起動する
        id: pg
        continue-on-error: true
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'PostgreSQL がランナーに入っていません' }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          # ランナーの PostgreSQL の初期パスワードは公開されている値（root）。秘密ではない
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\psql.exe" -U postgres -h localhost -c "create database company_directory"
      - name: 起動を確かめる（2 回起動して、CDS で速くなるかも見る）
        if: steps.pg.outcome == 'success'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP 'cd-home'
          New-Item -ItemType Directory -Force $homeDir | Out-Null
          @(
            'SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/company_directory',
            'SPRING_DATASOURCE_USERNAME=postgres',
            'SPRING_DATASOURCE_PASSWORD=root'
          ) | Set-Content -Encoding utf8 (Join-Path $homeDir '.env')
          pwsh packaging/ci/smoke-test.ps1 -AppDir build/desktop/dist/CompanyDirectory -HomeDir $homeDir
          # 確認で作られた CDS ファイルは配らない（各 PC の 1 回目の終了時に作られる）
          # CDS ファイルは読み取り専用で作られるので -Force を付けないと消えない
          Remove-Item build/desktop/dist/CompanyDirectory/app/*.jsa -Force -ErrorAction SilentlyContinue

      - name: フォルダ版を zip にする
        shell: pwsh
        run: |
          Remove-Item build/desktop/dist/CompanyDirectory/app/*.jsa -Force -ErrorAction SilentlyContinue
          if (Get-ChildItem build/desktop/dist/CompanyDirectory/app -Filter *.jsa) { throw 'CDS ファイルが消せませんでした（配布物に入ってしまいます）' }
          Compress-Archive -Path build/desktop/dist/CompanyDirectory -DestinationPath "CompanyDirectory-$env:DESKTOP_VERSION-windows.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: CompanyDirectory-windows-zip
          path: |
            CompanyDirectory-*-windows.zip
            java-version.txt
          retention-days: 30

      # ---- インストーラー（.msi）。jpackage（JDK 21）は WiX Toolset 3 が必要 ----
      - name: WiX Toolset 3 を用意する
        id: wix
        continue-on-error: true
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            $found = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              choco install wixtoolset --no-progress -y
              $found = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -First 1
            }
            if (-not $found) { throw 'WiX Toolset 3 が見つかりません' }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $found.FullName 'bin')
          }
      - name: インストーラーを作る（jpackage --type msi）
        if: steps.wix.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: ./gradlew desktopInstaller "-PdesktopVersion=$DESKTOP_VERSION" -PdesktopInstallerType=msi
      - uses: actions/upload-artifact@v6
        if: steps.wix.outcome == 'success'
        with:
          name: CompanyDirectory-windows-msi
          path: build/desktop/dist/*.msi
          if-no-files-found: warn
          retention-days: 30
