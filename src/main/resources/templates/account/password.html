<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>パスワード変更</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/app-icon.svg}">
    <link rel="stylesheet" th:href="@{/css/fonts/fonts.css}" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24
        }
    </style>
    <!-- 画面の CSS とフォントはアプリに同梱（オフラインでも崩れないように）。作り方は frontend/README.md -->
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <style>.font-display { font-family: "Noto Sans JP", "Space Grotesk", sans-serif; }</style>
</head>

<body class="font-display bg-background-light text-text-light-primary min-h-screen">
    <header
        class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10 bg-background-light/95 backdrop-blur-sm border-b border-gray-200">
        <a th:href="@{/companies}"
            class="flex size-12 shrink-0 items-center justify-center rounded-full text-gray-800 hover:bg-gray-200 transition-colors"
            aria-label="一覧に戻る" title="一覧に戻る">
            <span class="material-symbols-outlined text-3xl">arrow_back_ios_new</span>
        </a>
        <h1 class="text-xl font-bold leading-tight flex-1 text-center text-gray-900">パスワード変更</h1>
        <div class="w-12"></div>
    </header>

    <main class="mx-auto w-full max-w-[480px] px-4 py-6">
        <!-- パスワードは th:field を使わない（エラーで出し直したときに値を画面へ戻さないため） -->
        <form th:action="@{/account/password}" method="post" th:object="${passwordForm}" id="passwordForm"
            class="flex flex-col gap-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
            <p class="text-sm text-gray-600">
                ログイン中のアカウント（<span class="font-bold" th:text="${#authentication.name}"></span>）のパスワードを変えます。
                変えると、この画面以外の PC やブラウザの自動ログインは切れます。
            </p>
            <label class="flex flex-col gap-1">
                <span class="text-sm font-bold text-gray-800">現在のパスワード</span>
                <input type="password" name="currentPassword" maxlength="64" autocomplete="current-password"
                    class="form-input rounded-md border-gray-300 h-10" />
                <span th:if="${#fields.hasErrors('currentPassword')}"
                    th:text="${#fields.errors('currentPassword')[0]}" class="text-sm text-red-600"></span>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-sm font-bold text-gray-800">新しいパスワード（8〜64文字）</span>
                <input type="password" name="password" maxlength="64" autocomplete="new-password"
                    class="form-input rounded-md border-gray-300 h-10" />
                <span th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"
                    class="text-sm text-red-600"></span>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-sm font-bold text-gray-800">新しいパスワード（確認）</span>
                <input type="password" name="passwordConfirm" maxlength="64" autocomplete="new-password"
                    class="form-input rounded-md border-gray-300 h-10" />
                <span th:if="${#fields.hasErrors('passwordConfirm')}"
                    th:text="${#fields.errors('passwordConfirm')[0]}" class="text-sm text-red-600"></span>
            </label>
            <div class="flex justify-end gap-2">
                <a th:href="@{/companies}"
                    class="flex items-center justify-center rounded-md h-10 px-4 bg-gray-200 text-gray-800 text-sm font-bold hover:bg-gray-300 transition-colors">戻る</a>
                <button type="submit"
                    class="flex items-center justify-center gap-2 rounded-md h-10 px-4 bg-primary text-white text-sm font-bold hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-base">key</span>
                    <span>変更する</span>
                </button>
            </div>
        </form>
    </main>
</body>

</html>
