<!DOCTYPE html>
<html class="dark" lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>サーバーエラー</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/app-icon.svg}">
    <link rel="stylesheet" th:href="@{/css/fonts/fonts.css}" />
    <!-- 画面の CSS とフォントはアプリに同梱（オフラインでも崩れないように）。作り方は frontend/README.md -->

</head>

<body class="font-['Inter'] bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="text-center p-8">
        <span class="material-symbols-outlined text-8xl text-red-500 mb-4">cloud_off</span>

            再読み込み
        </button>
    </div>
