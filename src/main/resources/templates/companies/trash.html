<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>廃棄データ・アーカイブ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/app-icon.svg}">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0066cc",
                        "background-light": "#fffbf0",
                        "background-dark": "#fffbf0",
                        "text-light-primary": "#222222",
                    },
                    fontFamily: {
                        "display": ["Noto Sans JP", "Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .group:focus-within .group-focus-within\:block {
            display: block;
        }

        .group:focus-within .group-focus-within\:opacity-100 {
            opacity: 1;
        }

        .group:focus-within .group-focus-within\:pointer-events-auto {
            pointer-events: auto;
        }

        html:not(.js-state-restored) .js-state-content {
            visibility: hidden;
        }

        html:not(.js-state-restored) #page-loader {
            display: flex;
        }

        #page-loader {
            display: none;
        }

        .resizable-table {
            table-layout: fixed;
        }

        .resizable-table th,
        .resizable-table td {
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .resizable-table .col-resizer {
            position: absolute;
            top: 0;
            right: -2px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            user-select: none;
        }

        .resizable-table .row-resizer {
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 6px;
            cursor: row-resize;
            user-select: none;
        }

        body.resizing-col {
            cursor: col-resize;
            user-select: none;
        }

        body.resizing-row {
            cursor: row-resize;
            user-select: none;
        }

        .resizable-table .header-cell {
            position: relative;
            display: block;
            padding-right: 18px;
        }

        .resizable-table .header-text {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .resizable-table .sort-icon {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
        }

        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toast {
            background-color: #1c2127;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            min-width: 350px;
            animation: slideIn 0.3s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.hiding {
            animation: slideOut 0.3s ease-in forwards;
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-close-btn {
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            margin-right: -0.5rem;
        }

        .toast-close-btn:hover {
            color: white;
        }
    </style>

    <script th:inline="javascript">
            (function () {
                const currentUrl = `${window.location.pathname}${window.location.search}`;
                const lastUrl = sessionStorage.getItem('lastTrashUrl');
                const hasFlashMessage = /*[[${successMessage != null || errorMessage != null}]]*/ false;
                const params = new URLSearchParams(window.location.search);
                const isClearAction = params.get('clear') === '1';

                if (!hasFlashMessage && !isClearAction && !window.location.search && lastUrl && lastUrl !== currentUrl) {
                    window.location.replace(lastUrl);
                    return;
                }

                document.documentElement.classList.add('js-state-restored');
                sessionStorage.setItem('lastTrashUrl', currentUrl);
            })();
    </script>
</head>

<body class="font-display bg-background-light dark:bg-archive-dark">
    <div id="page-loader" class="fixed inset-0 z-50 flex items-center justify-center bg-white/80 dark:bg-[#1a1816]/80">
        <div class="flex items-center gap-3 rounded-lg bg-white/90 dark:bg-[#2d2a27]/90 px-4 py-3 shadow">
            <span class="material-symbols-outlined animate-spin text-primary">progress_activity</span>
            <span class="text-sm text-archive-text">読み込み中...</span>
        </div>
    </div>
    <div
        class="js-state-content relative flex h-screen w-full flex-col bg-background-light dark:bg-archive-dark group/design-root overflow-hidden">
        <div class="flex h-full grow flex-col">
            <div class="px-4 sm:px-6 md:px-8 lg:px-10 flex flex-col h-full">
                <div class="layout-content-container flex flex-col w-full mx-auto max-w-[1400px] flex-1 h-full py-4">
                    <div class="flex flex-col flex-1 h-full">
                        <div class="flex flex-wrap justify-between items-center gap-4 pb-3">
                            <h1
                                class="text-gray-800 dark:text-archive-text text-2xl font-bold leading-tight tracking-[-0.033em]">
                                廃棄データ・アーカイブ</h1>
                            <div class="flex flex-wrap items-center gap-2">
                                <form th:action="@{/companies}" method="get">
                                    <button id="backToListBtn"
                                        class="flex min-w-[84px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-md h-9 px-3 bg-gray-200 dark:bg-archive-dark-panel text-gray-800 dark:text-archive-text text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-300 dark:hover:bg-archive-dark-border transition-colors">
                                        <span class="material-symbols-outlined text-base">arrow_back</span>
                                        <span class="truncate">一覧へ戻る</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <div
                            class="mb-4 rounded-lg border border-amber-400/40 bg-amber-50 px-4 py-3 text-sm text-amber-700 dark:border-amber-500/40 dark:bg-amber-500/10 dark:text-amber-200">
                            削除したデータは30日後に自動的に完全削除されます。
                        </div>
                        <form id="trashSearchForm" th:action="@{/companies/trash}" method="get"
                            th:object="${searchForm}">
                            <input type="hidden" name="size" th:value="${page?.size} ?: 5" />
                            <div class="flex flex-col gap-3 pb-3">
                                <div class="flex items-start gap-3">
                                    <div class="flex-1">
                                        <label class="flex flex-col min-w-40 h-10">
                                            <div class="flex w-full flex-1 items-stretch rounded-lg h-full">
                                                <div
                                                    class="text-[#9dabb9] flex bg-white dark:bg-[#283039] items-center justify-center pl-4 rounded-l-lg border border-gray-300 dark:border-[#3b4754] border-r-0">
                                                    <span class="material-symbols-outlined">search</span>
                                                </div>
                                                <input name="keyword" th:value="${searchForm?.keyword}"
                                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border-gray-300 dark:border-[#3b4754] bg-white dark:bg-[#283039] focus:border-primary/50 h-full placeholder:text-gray-400 dark:placeholder:text-[#9dabb9] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal"
                                                    placeholder="キーワード検索..." />
                                            </div>
                                        </label>
                                    </div>
                                    <div class="flex-1 relative">
                                        <details
                                            class="w-full rounded-lg border border-gray-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] group">
                                            <summary class="flex cursor-pointer items-center gap-2 px-3 h-10 list-none">
                                                <p
                                                    class="text-gray-800 dark:text-white text-sm font-medium leading-normal">
                                                    詳細検索</p>
                                                <div
                                                    class="ml-auto text-gray-600 dark:text-white group-open:rotate-180 transition-transform">
                                                    <span class="material-symbols-outlined">expand_more</span>
                                                </div>
                                            </summary>
                                            <div class="absolute top-full left-0 w-full mt-2 z-20">
                                                <div
                                                    class="border border-gray-300 dark:border-[#3b4754] p-4 bg-white dark:bg-[#1c2127] rounded-lg shadow-lg">
                                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                        <div>
                                                            <label
                                                                class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">企業ID</label>
                                                            <input name="companyId" th:value="${searchForm?.companyId}"
                                                                class="form-input block w-full rounded-md bg-white dark:bg-[#283039] border-gray-300 dark:border-[#3b4754] text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:ring-primary focus:border-primary h-9 text-sm"
                                                                placeholder="例: 0001" type="number" step="1" />
                                                        </div>
                                                        <div>
                                                            <label
                                                                class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">企業名</label>
                                                            <input name="companyName"
                                                                th:value="${searchForm?.companyName}"
                                                                class="form-input block w-full rounded-md bg-white dark:bg-[#283039] border-gray-300 dark:border-[#3b4754] text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:ring-primary focus:border-primary h-9 text-sm"
                                                                placeholder="例: 株式会社未来テクノロジー" type="text" />
                                                        </div>
                                                        <!-- Trashでは住所・郵便番号列はないが検索機能としては残す -->
                                                        <div>
                                                            <label
                                                                class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">住所</label>
                                                            <input name="address" th:value="${searchForm?.address}"
                                                                class="form-input block w-full rounded-md bg-white dark:bg-[#283039] border-gray-300 dark:border-[#3b4754] text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:ring-primary focus:border-primary h-9 text-sm"
                                                                placeholder="例: 東京都千代田区" type="text" />
                                                        </div>
                                                        <div>
                                                            <label
                                                                class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">郵便番号</label>
                                                            <input name="zipCode" th:value="${searchForm?.zipCode}"
                                                                class="form-input block w-full rounded-md bg-white dark:bg-[#283039] border-gray-300 dark:border-[#3b4754] text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:ring-primary focus:border-primary h-9 text-sm"
                                                                placeholder="例: 100-0005" type="text" />
                                                        </div>
                                                        <div class="md:col-span-2">
                                                            <label
                                                                class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">登録日</label>
                                                            <div class="flex items-center gap-2">
                                                                <input name="dateFrom"
                                                                    th:value="${searchForm?.dateFrom}"
                                                                    class="form-input block w-full rounded-md bg-white dark:bg-[#283039] border-gray-300 dark:border-[#3b4754] text-gray-800 dark:text-white focus:ring-primary focus:border-primary h-9 text-sm"
                                                                    type="date" />
                                                                <span class="text-gray-500 dark:text-gray-400">〜</span>
                                                                <input name="dateTo" th:value="${searchForm?.dateTo}"
                                                                    class="form-input block w-full rounded-md bg-white dark:bg-[#283039] border-gray-300 dark:border-[#3b4754] text-gray-800 dark:text-white focus:ring-primary focus:border-primary h-9 text-sm"
                                                                    type="date" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="flex justify-end gap-2 mt-4">
                                                        <a th:href="@{/companies/trash(clear=1)}"
                                                            class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-9 px-4 bg-gray-200 dark:bg-[#283039] text-gray-800 dark:text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-300 dark:hover:bg-[#3b4754] transition-colors">クリア</a>
                                                        <button type="submit"
                                                            class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-9 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">検索</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </details>
                                    </div>
                                    <div class="relative">
                                        <button type="button" id="settingsButton"
                                            class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-gray-200 dark:bg-[#283039] text-gray-800 dark:text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-300 dark:hover:bg-[#3b4754] transition-colors">
                                            <span class="material-symbols-outlined text-xl">settings</span>
                                        </button>
                                        <div id="settingsDropdown"
                                            class="hidden absolute top-full right-0 mt-2 w-64 bg-white dark:bg-[#283039] border border-gray-300 dark:border-[#3b4754] rounded-lg shadow-xl z-20">
                                            <div class="p-4 border-b border-gray-200 dark:border-[#3b4754]">
                                                <h3 class="text-sm font-bold text-gray-800 dark:text-white text-left">
                                                    列の表示設定</h3>
                                            </div>
                                            <div class="p-4 space-y-3 text-sm text-left" id="columnSettings">
                                                <label
                                                    class="flex items-center gap-2 cursor-pointer text-gray-500 dark:text-gray-400">
                                                    <input type="checkbox" data-col="companyName" checked disabled
                                                        class="form-checkbox rounded text-primary focus:ring-primary/50 bg-gray-200 dark:bg-gray-700 border-gray-300 dark:border-gray-600 cursor-not-allowed" />
                                                    <span class="opacity-75">企業名</span>
                                                </label>
                                                <label
                                                    class="flex items-center gap-2 cursor-pointer text-gray-800 dark:text-white">
                                                    <input type="checkbox" data-col="companyId" checked
                                                        class="form-checkbox rounded text-primary focus:ring-primary/50 bg-white dark:bg-gray-800 border-gray-300 dark:border-gray-600" />
                                                    <span>企業ID</span>
                                                </label>
                                                <label
                                                    class="flex items-center gap-2 cursor-pointer text-gray-800 dark:text-white">
                                                    <input type="checkbox" data-col="deletedAt" checked
                                                        class="form-checkbox rounded text-primary focus:ring-primary/50 bg-white dark:bg-gray-800 border-gray-300 dark:border-gray-600" />
                                                    <span>削除日時</span>
                                                </label>
                                                <label
                                                    class="flex items-center gap-2 cursor-pointer text-gray-800 dark:text-white">
                                                    <input type="checkbox" data-col="deletedBy" checked
                                                        class="form-checkbox rounded text-primary focus:ring-primary/50 bg-white dark:bg-gray-800 border-gray-300 dark:border-gray-600" />
                                                    <span>削除実行者</span>
                                                </label>
                                                <label
                                                    class="flex items-center gap-2 cursor-pointer text-gray-500 dark:text-gray-400">
                                                    <input type="checkbox" data-col="actions" checked disabled
                                                        class="form-checkbox rounded text-primary focus:ring-primary/50 bg-gray-200 dark:bg-gray-700 border-gray-300 dark:border-gray-600 cursor-not-allowed" />
                                                    <span class="opacity-75">操作</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>

                        <div
                            class="flex overflow-hidden rounded-lg border border-archive-dark-border bg-archive-dark flex-col flex-1">
                            <div class="overflow-y-auto flex-1">
                                <table class="resizable-table w-full min-w-[1000px] text-sm">
                                    <thead class="sticky top-0 z-10 bg-amber-50">
                                        <tr class="bg-amber-50">
                                            <th data-col="displayNumber" data-sort-type="number"
                                                class="bg-amber-50 px-4 py-2.5 text-center text-archive-text w-[60px] font-medium leading-normal group cursor-pointer">
                                                <div class="header-cell">
                                                    <span class="header-text">No.</span>
                                                    <span
                                                        class="sort-icon text-xs text-archive-text-dim group-hover:text-archive-text">↕</span>
                                                </div>
                                            </th>
                                            <th data-col="companyId" data-sort-type="number"
                                                class="bg-amber-50 px-4 py-2.5 text-left text-archive-text w-[120px] font-medium leading-normal group cursor-pointer whitespace-nowrap">
                                                <div class="header-cell">
                                                    <span class="header-text">企業ID</span>
                                                    <span
                                                        class="sort-icon text-xs text-archive-text-dim group-hover:text-archive-text">↕</span>
                                                </div>
                                            </th>
                                            <th data-col="companyName" data-sort-type="text"
                                                class="bg-amber-50 px-4 py-2.5 text-left text-archive-text min-w-[200px] font-medium leading-normal group cursor-pointer">
                                                <div class="header-cell">
                                                    <span class="header-text">企業名</span>
                                                    <span
                                                        class="sort-icon text-xs text-archive-text-dim group-hover:text-archive-text">↕</span>
                                                </div>
                                            </th>
                                            <th data-col="deletedAt" data-sort-type="date"
                                                class="bg-amber-50 px-4 py-2.5 text-left text-archive-text w-[200px] font-bold leading-normal group cursor-pointer text-amber-300">
                                                <div class="header-cell">
                                                    <span class="header-text">削除日時</span>
                                                    <span
                                                        class="sort-icon text-xs text-archive-text-dim group-hover:text-archive-text">↕</span>
                                                </div>
                                            </th>
                                            <th data-col="deletedBy" data-sort-type="text"
                                                class="bg-amber-50 px-4 py-2.5 text-left text-archive-text w-[180px] font-bold leading-normal group cursor-pointer text-amber-300">
                                                <div class="header-cell">
                                                    <span class="header-text">削除実行者</span>
                                                    <span
                                                        class="sort-icon text-xs text-archive-text-dim group-hover:text-archive-text">↕</span>
                                                </div>
                                            </th>
                                            <th data-col="actions"
                                                class="bg-amber-50 px-4 py-2.5 text-center text-archive-text w-[120px] font-medium leading-normal">
                                                操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:if="${page.totalElements == 0}" class="js-empty-row">
                                            <td colspan="6" class="px-4 py-10 text-center text-archive-text-dim">
                                                該当データがありません
                                            </td>
                                        </tr>
                                        <tr th:each="company, iterStat : ${trashCompanies}"
                                            class="border-t border-t-archive-dark-border hover:bg-archive-dark-panel/50">
                                            <td data-col="displayNumber"
                                                class="px-4 py-2 text-center text-archive-text-dim font-normal leading-normal">
                                                [[${company.displayNumber}]]</td>
                                            <td data-col="companyId"
                                                class="px-4 py-2 text-archive-text-dim font-normal leading-normal whitespace-nowrap">
                                                [[${company.companyId}]]</td>
                                            <td data-col="companyName"
                                                class="px-4 py-2 text-archive-text font-normal leading-normal">
                                                [[${company.companyName}]]</td>
                                            <td data-col="deletedAt"
                                                class="px-4 py-2 text-amber-400 font-medium leading-normal"
                                                th:text="${#temporals.format(company.deletedAt, 'yyyy/MM/dd HH:mm')}">
                                            </td>
                                            <td data-col="deletedBy"
                                                class="px-4 py-2 text-amber-400 font-medium leading-normal">
                                                [[${company.deletedBy}]]</td>
                                            <td data-col="actions" class="px-4 py-2">
                                                <div class="flex justify-center items-center h-full">
                                                    <form
                                                        th:action="@{/companies/trash/restore/{id}(id=${company.companyId})}"
                                                        method="post">
                                                        <input type="hidden" name="returnUrl"
                                                            class="return-url-input" />
                                                        <button
                                                            class="flex min-w-[84px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-md h-8 px-3 bg-teal-600 text-white text-xs font-bold leading-normal tracking-[0.015em] hover:bg-teal-500 transition-colors">
                                                            <span
                                                                class="material-symbols-outlined text-base">restore_from_trash</span>
                                                            <span class="truncate">復元</span>
                                                        </button>
                                                    </form>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div
                                class="flex flex-wrap items-center justify-between gap-4 p-3 border-t border-archive-dark-border">
                                <div class="flex items-center gap-2 text-sm text-archive-text-dim">
                                    <span>表示件数:</span>
                                    <form id="pageSizeForm" th:action="@{/companies/trash}" method="get">
                                        <!-- 検索条件を維持するための隠しフィールド -->
                                        <input type="hidden" name="keyword" th:value="${searchForm?.keyword}" />
                                        <input type="hidden" name="companyId" th:value="${searchForm?.companyId}" />
                                        <input type="hidden" name="companyName" th:value="${searchForm?.companyName}" />
                                        <input type="hidden" name="address" th:value="${searchForm?.address}" />
                                        <input type="hidden" name="zipCode" th:value="${searchForm?.zipCode}" />
                                        <input type="hidden" name="dateFrom" th:value="${searchForm?.dateFrom}" />
                                        <input type="hidden" name="dateTo" th:value="${searchForm?.dateTo}" />
                                        <select name="size" onchange="document.getElementById('pageSizeForm').submit()"
                                            class="form-select rounded-md bg-archive-dark-panel border-archive-dark-border focus:ring-primary focus:border-primary h-8 py-0 pl-2 pr-7 text-sm text-archive-text">
                                            <option value="5" th:selected="${page.size == 5}">5</option>
                                            <option value="10" th:selected="${page.size == 10}">10</option>
                                            <option value="20" th:selected="${page.size == 20}">20</option>
                                            <option value="50" th:selected="${page.size == 50}">50</option>
                                            <option value="100" th:selected="${page.size == 100}">100</option>
                                        </select>
                                    </form>
                                </div>
                                <div class="flex items-center gap-2 text-sm text-archive-text-dim">
                                    <span
                                        th:text="${(page.number * page.size + 1) + '-' + (page.number * page.size + page.numberOfElements) + ' of ' + page.totalElements + '件'}"></span>
                                    <div class="flex items-center gap-2">
                                        <span>ページ</span>
                                        <input id="pageJumpInput" type="number" min="1"
                                            th:attr="max=${page.totalPages > 0 ? page.totalPages : 1}"
                                            th:value="${page.totalPages == 0 ? 1 : page.number + 1}"
                                            class="w-16 rounded-md bg-archive-dark-panel border-archive-dark-border focus:ring-primary focus:border-primary h-8 text-sm text-center text-archive-text" />
                                        <span th:text="|/ ${page.totalPages}|">/ 1</span>
                                    </div>
                                    <div class="flex gap-1 text-archive-text">
                                        <!-- First Page -->
                                        <a th:href="@{/companies/trash(page=0, size=${page.size}, keyword=${searchForm.keyword}, companyId=${searchForm.companyId}, companyName=${searchForm.companyName}, address=${searchForm.address}, zipCode=${searchForm.zipCode}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo})}"
                                            th:classappend="${page.first or page.totalElements == 0} ? 'pointer-events-none opacity-50' : ''">
                                            <button th:disabled="${page.first or page.totalElements == 0}"
                                                class="h-8 w-8 rounded flex items-center justify-center hover:bg-archive-dark-panel disabled:opacity-50">
                                                <span class="material-symbols-outlined text-xl">first_page</span>
                                            </button>
                                        </a>

                                        <!-- Previous Page -->
                                        <a th:href="@{/companies/trash(page=${page.number - 1}, size=${page.size}, keyword=${searchForm.keyword}, companyId=${searchForm.companyId}, companyName=${searchForm.companyName}, address=${searchForm.address}, zipCode=${searchForm.zipCode}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo})}"
                                            th:classappend="${page.first or page.totalElements == 0} ? 'pointer-events-none opacity-50' : ''">
                                            <button th:disabled="${page.first or page.totalElements == 0}"
                                                class="h-8 w-8 rounded flex items-center justify-center hover:bg-archive-dark-panel disabled:opacity-50">
                                                <span class="material-symbols-outlined text-xl">chevron_left</span>
                                            </button>
                                        </a>

                                        <!-- Next Page -->
                                        <a th:href="@{/companies/trash(page=${page.number + 1}, size=${page.size}, keyword=${searchForm.keyword}, companyId=${searchForm.companyId}, companyName=${searchForm.companyName}, address=${searchForm.address}, zipCode=${searchForm.zipCode}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo})}"
                                            th:classappend="${page.last or page.totalElements == 0} ? 'pointer-events-none opacity-50' : ''">
                                            <button th:disabled="${page.last or page.totalElements == 0}"
                                                class="h-8 w-8 rounded flex items-center justify-center hover:bg-archive-dark-panel disabled:opacity-50">
                                                <span class="material-symbols-outlined text-xl">chevron_right</span>
                                            </button>
                                        </a>

                                        <!-- Last Page -->
                                        <a th:href="@{/companies/trash(page=${page.totalPages - 1}, size=${page.size}, keyword=${searchForm.keyword}, companyId=${searchForm.companyId}, companyName=${searchForm.companyName}, address=${searchForm.address}, zipCode=${searchForm.zipCode}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo})}"
                                            th:classappend="${page.last or page.totalElements == 0} ? 'pointer-events-none opacity-50' : ''">
                                            <button th:disabled="${page.last or page.totalElements == 0}"
                                                class="h-8 w-8 rounded flex items-center justify-center hover:bg-archive-dark-panel disabled:opacity-50">
                                                <span class="material-symbols-outlined text-xl">last_page</span>
                                            </button>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            const STORAGE_KEY = 'trashListVisibleColumns';

            // デフォルトの表示設定
            const defaultSettings = {
                companyId: false,  // デフォルト非表示
                companyName: true,
                deletedAt: true,
                deletedBy: true,
                actions: true
            };

            // localStorageから設定を読み込む
            function loadSettings() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? { ...defaultSettings, ...JSON.parse(saved) } : defaultSettings;
                } catch (e) {
                    return defaultSettings;
                }
            }

            // localStorageに設定を保存
            function saveSettings(settings) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
            }

            // 列の表示/非表示を適用（テーブル内のth, tdのみ対象）
            function applyColumnVisibility(settings) {
                Object.keys(settings).forEach(col => {
                    const cells = document.querySelectorAll(`table [data-col="${col}"]`);
                    cells.forEach(cell => {
                        cell.style.display = settings[col] ? '' : 'none';
                    });
                });
            }

            // チェックボックスの状態を設定に反映
            function syncCheckboxes(settings) {
                const checkboxes = document.querySelectorAll('#columnSettings input[type="checkbox"]');
                checkboxes.forEach(cb => {
                    const col = cb.dataset.col;
                    if (col && settings[col] !== undefined) {
                        cb.checked = settings[col];
                    }
                });
            }

            // 初期化
            function init() {
                const settings = loadSettings();
                syncCheckboxes(settings);
                applyColumnVisibility(settings);

                // チェックボックスの変更イベント（リアルタイム反映）
                const checkboxes = document.querySelectorAll('#columnSettings input[type="checkbox"]:not(:disabled)');
                checkboxes.forEach(cb => {
                    cb.addEventListener('change', function () {
                        const col = this.dataset.col;
                        settings[col] = this.checked;
                        applyColumnVisibility(settings);
                        saveSettings(settings);
                    });
                });
            }

            // DOMContentLoaded後に実行
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 設定メニューの表示切り替え
            const settingsButton = document.getElementById('settingsButton');
            const settingsDropdown = document.getElementById('settingsDropdown');

            if (settingsButton && settingsDropdown) {
                settingsButton.addEventListener('click', function (e) {
                    e.stopPropagation();
                    settingsDropdown.classList.toggle('hidden');
                });

                // メニュー外クリックで閉じる
                document.addEventListener('click', function (e) {
                    if (!settingsDropdown.contains(e.target) && !settingsButton.contains(e.target)) {
                        settingsDropdown.classList.add('hidden');
                    }
                });

                // メニュー内のクリックイベント伝播を止める（チェックボックス操作で閉じないようにするため）
                settingsDropdown.addEventListener('click', function (e) {
                    e.stopPropagation();
                });
            }

            // --- Back Button Logic (State Persistence) ---
            (function () {
                const backBtn = document.getElementById('backToListBtn');
                const DEFAULT_URL = '/companies';
                const lastUrl = sessionStorage.getItem('lastListUrl') || DEFAULT_URL;

                if (backBtn) {
                    backBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.location.href = lastUrl;
                    });
                }
            })();

            (function () {
                const inputs = document.querySelectorAll('.return-url-input');
                const lastTrashUrl = sessionStorage.getItem('lastTrashUrl') || `${window.location.pathname}${window.location.search}` || '/companies/trash';
                inputs.forEach(input => {
                    input.value = lastTrashUrl;
                });
            })();

            (function () {
                const form = document.getElementById('trashSearchForm');
                if (!form) return;

                const targetInputs = form.querySelectorAll('input:not([type="hidden"])');
                targetInputs.forEach(input => {
                    const wrapper = input.parentElement;
                    if (!wrapper) return;

                    wrapper.classList.add('relative');
                    input.classList.add('pr-8');

                    let btn = wrapper.querySelector(`.search-clear-btn[data-clear-target="${input.name}"]`);
                    if (!btn) {
                        btn = document.createElement('button');
                        btn.type = 'button';
                        btn.dataset.clearTarget = input.name;
                        btn.className = 'search-clear-btn absolute right-2 top-1/2 -translate-y-1/2 h-5 w-5 inline-flex items-center justify-center leading-none text-gray-400 hover:text-gray-700 dark:text-gray-500 dark:hover:text-gray-300 hidden';
                        btn.innerHTML = '<span class="material-symbols-outlined text-sm leading-none">close</span>';
                        wrapper.appendChild(btn);
                    }

                    const toggle = () => btn.classList.toggle('hidden', !input.value);
                    input.addEventListener('input', toggle);
                    btn.addEventListener('click', () => {
                        input.value = '';
                        input.dispatchEvent(new Event('input'));
                        input.focus();
                    });
                    toggle();
                });
            })();

            // Table Sort Logic
            (function () {
                const table = document.querySelector('table');
                const tbody = table ? table.querySelector('tbody') : null;
                const headers = table ? table.querySelectorAll('thead th[data-col]') : [];
                const state = { column: null, direction: null };
                const originalRows = tbody ? Array.from(tbody.querySelectorAll('tr')) : [];

                if (!table || !tbody || headers.length === 0) return;

                function parseValue(value, type) {
                    if (type === 'number') {
                        const num = parseFloat(value.replace(/[^0-9.-]/g, ''));
                        return Number.isNaN(num) ? null : num;
                    }
                    if (type === 'date') {
                        const date = Date.parse(value);
                        return Number.isNaN(date) ? null : date;
                    }
                    return value.toLowerCase();
                }

                function updateIcons(activeCol, direction) {
                    headers.forEach(header => {
                        const icon = header.querySelector('.sort-icon');
                        if (!icon) return;
                        if (header.dataset.col === activeCol && direction) {
                            icon.textContent = direction === 'asc' ? '↑' : '↓';
                        } else {
                            icon.textContent = '↕';
                        }
                    });
                }

                function resetRows() {
                    originalRows.forEach(row => tbody.appendChild(row));
                }

                function sortRows(column, type, direction) {
                    const rows = Array.from(tbody.querySelectorAll('tr'))
                        .filter(row => !row.classList.contains('js-empty-row'));

                    rows.sort((a, b) => {
                        const aCell = a.querySelector(`[data-col="${column}"]`);
                        const bCell = b.querySelector(`[data-col="${column}"]`);
                        const aValue = parseValue(aCell ? aCell.textContent.trim() : '', type);
                        const bValue = parseValue(bCell ? bCell.textContent.trim() : '', type);

                        if (aValue === null && bValue === null) return 0;
                        if (aValue === null) return 1;
                        if (bValue === null) return -1;

                        if (aValue < bValue) return direction === 'asc' ? -1 : 1;
                        if (aValue > bValue) return direction === 'asc' ? 1 : -1;
                        return 0;
                    });

                    rows.forEach(row => tbody.appendChild(row));
                }

                headers.forEach(header => {
                    if (header.dataset.col === 'actions') return;
                    header.addEventListener('click', (event) => {
                        if (window.__isResizingColumn) return;
                        if (event.target.closest('.col-resizer')) return;
                        const column = header.dataset.col;
                        const type = header.dataset.sortType || 'text';
                        const isSame = state.column === column;
                        let nextDirection = 'asc';

                        if (isSame) {
                            if (state.direction === 'asc') {
                                nextDirection = 'desc';
                            } else if (state.direction === 'desc') {
                                nextDirection = null;
                            }
                        }

                        if (nextDirection === null) {
                            state.column = null;
                            state.direction = null;
                            resetRows();
                            updateIcons(null, null);
                        } else {
                            state.column = column;
                            state.direction = nextDirection;
                            sortRows(column, type, nextDirection);
                            updateIcons(column, nextDirection);
                        }
                    });
                });
            })();

            // Page Jump Logic
            (function () {
                const input = document.getElementById('pageJumpInput');
                if (!input) return;

                const max = parseInt(input.getAttribute('max') || '1', 10);
                const clampPage = (value) => Math.min(Math.max(value, 1), max);

                function jumpToPage(value) {
                    const pageNumber = clampPage(value) - 1;
                    const params = new URLSearchParams(window.location.search);
                    params.set('page', pageNumber.toString());
                    const query = params.toString();
                    window.location.href = `${window.location.pathname}${query ? `?${query}` : ''}`;
                }

                input.addEventListener('change', () => {
                    const value = parseInt(input.value || '1', 10);
                    if (!Number.isNaN(value)) {
                        jumpToPage(value);
                    }
                });

                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        const value = parseInt(input.value || '1', 10);
                        if (!Number.isNaN(value)) {
                            jumpToPage(value);
                        }
                    }
                });
            })();

            function showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = 'toast';

                let icon = 'check_circle';
                let iconColor = 'text-green-500';
                if (type === 'error') {
                    icon = 'error';
                    iconColor = 'text-red-500';
                } else if (type === 'warning') {
                    icon = 'warning';
                    iconColor = 'text-amber-400';
                }

                toast.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined ${iconColor}">${icon}</span>
                        <span class="text-sm font-medium">${message}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button class="toast-close-btn">
                            <span class="material-symbols-outlined text-base">close</span>
                        </button>
                    </div>
                `;

                const closeBtn = toast.querySelector('.toast-close-btn');
                closeBtn.onclick = () => {
                    hideToast(toast);
                };

                container.appendChild(toast);

                const timerId = setTimeout(() => {
                    hideToast(toast);
                }, 10000);

                toast.dataset.timerId = timerId;
            }

            function hideToast(toast) {
                if (toast.classList.contains('hiding')) return;
                clearTimeout(toast.dataset.timerId);
                toast.classList.add('hiding');
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }

            window.addEventListener('load', () => {
                const successMsg = /*[[${successMessage}]]*/ null;
                const errorMsg = /*[[${errorMessage}]]*/ null;

                if (successMsg) {
                    showToast(successMsg, 'success');
                }
                if (errorMsg) {
                    showToast(errorMsg, 'error');
                }
            });

            (function () {
                const MIN_COL_WIDTH = 60;
                const MIN_ROW_HEIGHT = 28;
                window.__isResizingColumn = false;

                function initResizableTable(table) {
                    const headerRow = table.tHead && table.tHead.rows[0];
                    if (headerRow) {
                        Array.from(headerRow.cells).forEach((th, index) => {
                            if (th.querySelector('.col-resizer')) return;
                            const resizer = document.createElement('div');
                            resizer.className = 'col-resizer';
                            th.appendChild(resizer);

                            let startX = 0;
                            let startWidth = 0;

                            const onMouseMove = (event) => {
                                const newWidth = Math.max(MIN_COL_WIDTH, startWidth + (event.pageX - startX));
                                th.style.width = `${newWidth}px`;
                                Array.from(table.tBodies[0]?.rows || []).forEach(row => {
                                    const cell = row.children[index];
                                    if (cell) {
                                        cell.style.width = `${newWidth}px`;
                                    }
                                });
                            };

                            const onMouseUp = () => {
                                document.removeEventListener('mousemove', onMouseMove);
                                document.removeEventListener('mouseup', onMouseUp);
                                document.body.classList.remove('resizing-col');
                                setTimeout(() => { window.__isResizingColumn = false; }, 0);
                            };

                            resizer.addEventListener('mousedown', (event) => {
                                event.preventDefault();
                                event.stopPropagation();
                                window.__isResizingColumn = true;
                                startX = event.pageX;
                                startWidth = th.offsetWidth;
                                document.addEventListener('mousemove', onMouseMove);
                                document.addEventListener('mouseup', onMouseUp);
                                document.body.classList.add('resizing-col');
                            });
                            resizer.addEventListener('click', (event) => {
                                event.stopPropagation();
                            });
                        });
                    }

                    Array.from(table.tBodies[0]?.rows || []).forEach(row => {
                        if (row.classList.contains('js-empty-row')) return;
                        const lastCell = row.cells[row.cells.length - 1];
                        if (!lastCell || lastCell.querySelector('.row-resizer')) return;

                        const resizer = document.createElement('div');
                        resizer.className = 'row-resizer';
                        lastCell.appendChild(resizer);

                        let startY = 0;
                        let startHeight = 0;

                        const onMouseMove = (event) => {
                            const newHeight = Math.max(MIN_ROW_HEIGHT, startHeight + (event.pageY - startY));
                            row.style.height = `${newHeight}px`;
                            Array.from(row.cells).forEach(cell => {
                                cell.style.height = `${newHeight}px`;
                            });
                        };

                        const onMouseUp = () => {
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);
                            document.body.classList.remove('resizing-row');
                        };

                        resizer.addEventListener('mousedown', (event) => {
                            event.preventDefault();
                            startY = event.pageY;
                            startHeight = row.offsetHeight;
                            document.addEventListener('mousemove', onMouseMove);
                            document.addEventListener('mouseup', onMouseUp);
                            document.body.classList.add('resizing-row');
                        });
                    });
                }

                function applyCellTitles(table) {
                    const cells = table.querySelectorAll('th[data-col], td[data-col]');
                    cells.forEach(cell => {
                        if (cell.dataset.col === 'actions') return;
                        const headerText = cell.querySelector('.header-text');
                        const text = headerText ? headerText.textContent.trim() : cell.textContent.trim();
                        if (text) {
                            cell.setAttribute('title', text);
                        } else {
                            cell.removeAttribute('title');
                        }
                    });
                }

                window.addEventListener('load', () => {
                    document.querySelectorAll('table.resizable-table').forEach(table => {
                        initResizableTable(table);
                        applyCellTitles(table);
                    });
                });
            })();
        })();
    </script>
    <a th:if="${page != null and !page.first and page.totalElements > 0}"
        th:href="@{/companies/trash(page=${page.number - 1}, size=${page.size}, keyword=${searchForm.keyword}, companyId=${searchForm.companyId}, companyName=${searchForm.companyName}, address=${searchForm.address}, zipCode=${searchForm.zipCode}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo})}"
        class="fixed left-4 top-1/2 z-30 -translate-y-1/2 inline-flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white shadow-lg transition hover:bg-primary/90"
        aria-label="前のページへ">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <a th:if="${page != null and !page.last and page.totalElements > 0}"
        th:href="@{/companies/trash(page=${page.number + 1}, size=${page.size}, keyword=${searchForm.keyword}, companyId=${searchForm.companyId}, companyName=${searchForm.companyName}, address=${searchForm.address}, zipCode=${searchForm.zipCode}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo})}"
        class="fixed right-4 top-1/2 z-30 -translate-y-1/2 inline-flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white shadow-lg transition hover:bg-primary/90"
        aria-label="次のページへ">
        <span class="material-symbols-outlined">arrow_forward</span>
    </a>
    <div id="toast-container"></div>
</body>

</html>
