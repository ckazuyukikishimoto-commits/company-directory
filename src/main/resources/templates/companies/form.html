<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title th:text="${companyForm.id} != null ? '編集' : '新規登録'"></title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/app-icon.svg}">
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0066cc", // Accessible Blue
            "background-light": "#fffbf0", // Warm White
            "background-dark": "#fffbf0", // Force Light
            "text-light-primary": "#222222",
          },
          fontFamily: {
            "display": ["Noto Sans JP", "Space Grotesk", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24
    }

    body {
      min-height: max(884px, 100dvh);
    }

    /* Custom Scrollbar for Modal Results */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(156, 163, 175, 0.8);
    }
  </style>
</head>

<body class="font-display bg-background-light text-text-light-primary">
  <!-- 成功メッセージ -->
  <div th:if="${successMessage}" class="p-4 mb-4 text-green-800 rounded-lg bg-green-100 border border-green-200">
    <span th:text="${successMessage}"></span>
  </div>
  <!-- エラーメッセージ -->
  <div th:if="${errorMessage}" class="p-4 mb-4 text-red-800 rounded-lg bg-red-100 border border-red-200">
    <span th:text="${errorMessage}"></span>
  </div>
  <div class="relative flex h-auto min-h-screen w-full flex-col">
    <header
      class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10 bg-background-light/95 backdrop-blur-sm border-b border-gray-200">
      <button type="button" id="headerBackBtn"
        class="flex size-12 shrink-0 items-center justify-center rounded-full text-gray-800 hover:bg-gray-200 transition-colors"
        aria-label="戻る">
        <span class="material-symbols-outlined text-3xl">arrow_back_ios_new</span>
      </button>
      <h1 class="text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center text-gray-900"
        th:text="${companyForm.id} != null ? '編集' : '新規登録'"></h1>
      <div class="w-12"></div>
    </header>
    <main class="flex-1 px-4 py-6">
      <form class="flex flex-col gap-6"
        th:action="${companyForm.id} ? @{/companies/edit/{id}(id=*{id})} : @{/companies/add}" method="post"
        th:object="${companyForm}">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="returnUrl" id="returnUrl">

        <!-- 企業名 -->
        <!-- 企業名 -->
        <label class="flex flex-col w-full">
          <p class="text-lg font-bold leading-normal pb-2 text-gray-800">
            企業名 <span class="text-red-600">*</span>
          </p>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-4 text-gray-500 text-2xl">apartment</span>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-400 bg-white h-16 placeholder:text-gray-400 pl-14 pr-4 text-lg font-medium leading-normal text-gray-900"
              name="companyName" th:field="*{companyName}" placeholder="株式会社〇〇" required />
          </div>
        </label>
        <div th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}" class="text-red-500 text-sm mt-1">
        </div>

        <!-- 郵便番号 -->
        <!-- 郵便番号 -->
        <label class="flex flex-col w-full">
          <p class="text-lg font-bold leading-normal pb-2 text-gray-800">
            郵便番号 <span class="text-red-600">*</span>
          </p>
          <div class="flex gap-3">
            <div class="relative flex items-center flex-1">
              <span class="material-symbols-outlined absolute left-4 text-gray-500 text-2xl">markunread_mailbox</span>
              <input name="zipCode" th:field="*{zipCode}" id="zipCode"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-400 bg-white h-16 placeholder:text-gray-400 pl-14 pr-4 text-lg font-medium leading-normal text-gray-900"
                placeholder="ハイフンあり（例: 123-4567）" maxlength="8" required />
            </div>
            <button type="button" id="btnZipSearch"
              class="flex items-center justify-center h-16 px-6 text-base font-bold text-white bg-gray-600 rounded-xl hover:bg-gray-700 transition-colors whitespace-nowrap shadow-sm">
              住所検索
            </button>
          </div>
          <div class="text-end mt-2">
            <button type="button" id="openAddressModal" class="text-base text-primary hover:underline font-bold">
              住所から郵便番号を探す
            </button>
          </div>
        </label>
        <div th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}" class="text-red-500 text-sm mt-1"></div>

        <!-- 住所 -->
        <!-- 住所 -->
        <label class="flex flex-col w-full">
          <p class="text-lg font-bold leading-normal pb-2 text-gray-800">
            住所 <span class="text-red-600">*</span>
          </p>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-4 text-gray-500 text-2xl">home</span>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-400 bg-gray-50 h-16 placeholder:text-gray-400 pl-14 pr-4 text-lg font-medium leading-normal text-gray-900"
              placeholder="郵便番号から自動入力されます" name="address" th:field="*{address}" id="address" required />
          </div>
          <div class="text-end mt-2">
            <button type="button" id="btnCompanySearch"
              class="inline-flex items-center gap-1 text-base text-primary hover:underline font-bold">
              <span class="material-symbols-outlined text-xl">search</span>
              住所から企業名検索
            </button>
          </div>
        </label>
        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-red-500 text-sm mt-1"></div>

        <!-- 備考 -->
        <!-- 備考 -->
        <label class="flex flex-col w-full">
          <p class="text-lg font-bold leading-normal pb-2 text-gray-800">備考</p>
          <div class="relative">
            <span class="material-symbols-outlined absolute top-4 left-4 text-gray-500 text-2xl">edit_note</span>
            <textarea
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-400 bg-white min-h-40 placeholder:text-gray-400 pt-5 pl-14 pr-4 text-lg font-medium leading-normal text-gray-900"
              placeholder="自由記述" name="remarks" th:field="*{remarks}"></textarea>
          </div>
        </label>
        <div th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}" class="text-red-500 text-sm mt-1"></div>

        <!-- アクションボタン -->
        <!-- アクションボタン -->
        <div class="flex flex-col sm:flex-row gap-4 mt-8 pb-10">
          <button type="button" id="footerCancelBtn"
            class="flex items-center justify-center w-full h-14 px-6 text-lg font-bold text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 transition-colors shadow-sm">
            キャンセル
          </button>
          <button type="submit"
            class="flex items-center justify-center w-full h-14 px-6 text-lg font-bold text-white bg-primary rounded-xl hover:bg-primary/90 transition-colors shadow-md hover:shadow-lg"
            th:text="${companyForm.id} != null ? '保存' : '登録'"></button>
        </div>
      </form>
  </div>

  <!-- 住所検索モーダル (Tailwind) -->
  <div id="addressSearchModal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity" id="modalBackdrop"></div>

    <!-- Modal Content -->
    <div class="flex min-h-full items-center justify-center p-4">
      <div
        class="relative w-full max-w-lg transform rounded-2xl bg-white p-6 shadow-xl transition-all border border-gray-200">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold text-gray-900">住所から検索</h3>
          <button type="button" id="closeAddressModal" class="text-gray-500 hover:text-gray-700">
            <span class="material-symbols-outlined text-2xl">close</span>
          </button>
        </div>

        <!-- Body -->
        <div class="flex gap-3 mb-4">
          <input type="text" id="addressKeyword"
            class="form-input flex-1 rounded-xl border-gray-300 bg-white text-gray-900 placeholder:text-gray-400 focus:ring-primary/50 text-lg h-12"
            placeholder="例：丸の内">
          <button type="button" id="btnAddressSearchExec"
            class="px-6 py-2 bg-primary text-white font-bold rounded-xl hover:bg-primary/90 transition-colors shadow-sm">
            検索
          </button>
        </div>

        <!-- Result List -->
        <div id="addressResultList" class="custom-scrollbar max-h-60 overflow-y-auto flex flex-col gap-1">
          <!-- JSで追加 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 企業名検索モーダル -->
  <div id="companySearchModal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity" id="companyModalBackdrop"></div>

    <!-- Modal Content -->
    <div class="flex min-h-full items-center justify-center p-4">
      <div
        class="relative w-full max-w-lg transform rounded-2xl bg-white p-6 shadow-xl transition-all border border-gray-200">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">apartment</span>
            企業名検索結果
          </h3>
          <button type="button" id="closeCompanyModal" class="text-gray-500 hover:text-gray-700">
            <span class="material-symbols-outlined text-2xl">close</span>
          </button>
        </div>

        <!-- 検索住所表示 -->
        <div id="companySearchAddress" class="mb-4 px-3 py-2 bg-gray-50 rounded-lg text-sm text-gray-600">
        </div>

        <!-- ローディング -->
        <div id="companySearchLoading" class="hidden py-8 text-center">
          <div class="inline-flex items-center gap-3 text-gray-500">
            <svg class="animate-spin h-6 w-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            <span class="text-base">検索中...</span>
          </div>
        </div>

        <!-- 結果リスト -->
        <div id="companyResultList" class="custom-scrollbar max-h-72 overflow-y-auto flex flex-col gap-1">
          <!-- JSで追加 -->
        </div>
      </div>
    </div>
  </div>

  <script>
      // --- 0. Back Button Logic (State Persistence) ---
      (function () {
        const backBtn = document.getElementById('headerBackBtn');
        const cancelBtn = document.getElementById('footerCancelBtn');
        const returnUrlInput = document.getElementById('returnUrl');
        const DEFAULT_URL = '/companies';

        // Retrieve last URL from query param or session, fallback to default
        const urlParams = new URLSearchParams(window.location.search);
        const paramReturnUrl = urlParams.get('returnUrl');
        const lastUrl = paramReturnUrl || sessionStorage.getItem('lastListUrl') || DEFAULT_URL;

        if (returnUrlInput) {
          returnUrlInput.value = lastUrl;
        }

        function goBack() {
          window.location.href = lastUrl;
        }

        if (backBtn) backBtn.addEventListener('click', goBack);
        if (cancelBtn) cancelBtn.addEventListener('click', goBack);
      })();

    // --- 1. 郵便番号から住所を自動入力 ---
    const zipInput = document.getElementById('zipCode');
    const btnSearch = document.getElementById('btnZipSearch');
    const addressInput = document.getElementById('address');

    function normalizeZipCodeInput() {
      const digits = zipInput.value.replace(/[^0-9]/g, '');
      if (digits.length === 7) {
        zipInput.value = `${digits.slice(0, 3)}-${digits.slice(3)}`;
      }
    }

    // ボタンクリックで実行
    btnSearch.addEventListener('click', fetchAddress);

    zipInput.addEventListener('blur', normalizeZipCodeInput);

    // エンターキーでも実行 (フォーム送信を防ぐ)
    zipInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        fetchAddress();
      }
    });

    function fetchAddress() {
      normalizeZipCodeInput();
      const zip = zipInput.value.replace(/-/g, '');
      if (zip.length < 7) {
        alert("郵便番号は7桁で入力してください");
        return;
      }

      // 自作APIを呼び出す
      fetch(`/api/zip/${zip}`)
        .then(response => {
          if (!response.ok) {
            // 404などの場合
            throw new Error('NotFound');
          }
          return response.json();
        })
        .then(data => {
          // ZipMasterのフィールド名に合わせて結合
          const fullAddress = (data.prefecture || '') + (data.city || '') + (data.town || '');
          addressInput.value = fullAddress;
        })
        .catch(error => {
          console.error(error);
          alert("該当する住所が見つかりませんでした。");
        });
    }

    // --- 2. 住所キーワード検索 (モーダル制御) ---
    const openModalBtn = document.getElementById('openAddressModal');
    const closeModalBtn = document.getElementById('closeAddressModal');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalElement = document.getElementById('addressSearchModal');
    const btnAddrExec = document.getElementById('btnAddressSearchExec');
    const keywordInput = document.getElementById('addressKeyword');
    const resultList = document.getElementById('addressResultList');

    // モーダル表示/非表示関数
    function toggleModal(show) {
      if (show) {
        modalElement.classList.remove('hidden');
        setTimeout(() => keywordInput.focus(), 100);
      } else {
        modalElement.classList.add('hidden');
      }
    }

    openModalBtn.addEventListener('click', (e) => {
      e.preventDefault();
      toggleModal(true);
    });

    closeModalBtn.addEventListener('click', () => toggleModal(false));
    modalBackdrop.addEventListener('click', () => toggleModal(false));

    // 検索実行
    btnAddrExec.addEventListener('click', executeAddressSearch);
    keywordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        executeAddressSearch();
      }
    });

    function executeAddressSearch() {
      const keyword = keywordInput.value.trim();
      if (!keyword) return;

      resultList.innerHTML = '<div class="text-zinc-500 p-2 text-center text-sm">検索中...</div>';

      fetch(`/api/zip/search?keyword=${encodeURIComponent(keyword)}`)
        .then(res => res.json())
        .then(data => {
          resultList.innerHTML = ''; // クリア

          if (!data || data.length === 0) {
            resultList.innerHTML = '<div class="text-zinc-500 dark:text-zinc-400 p-2 text-center text-sm">見つかりませんでした</div>';
            return;
          }

          data.forEach(item => {
            // リストアイテムを作成 (Buttonとして実装してアクセシビリティ向上)
            const button = document.createElement('button');
            button.type = "button";
            button.className = "w-full text-left px-3 py-2 text-sm rounded-md text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors";

            const fullAddr = (item.prefecture || '') + (item.city || '') + (item.town || '');
            button.textContent = `〒${item.zipCode} : ${fullAddr}`;

            // クリック時の動作
            button.addEventListener('click', () => {
              zipInput.value = item.zipCode;
              addressInput.value = fullAddr;
              toggleModal(false); // 閉じる
            });

            resultList.appendChild(button);
          });
        })
        .catch(err => {
          console.error(err);
          resultList.innerHTML = '<div class="text-red-500 p-2 text-center text-sm">エラーが発生しました</div>';
        });
    }

    // --- 3. 住所から企業名検索 (モーダル制御) ---
    const btnCompanySearch = document.getElementById('btnCompanySearch');
    const companyModal = document.getElementById('companySearchModal');
    const closeCompanyModal = document.getElementById('closeCompanyModal');
    const companyModalBackdrop = document.getElementById('companyModalBackdrop');
    const companyResultList = document.getElementById('companyResultList');
    const companySearchLoading = document.getElementById('companySearchLoading');
    const companySearchAddress = document.getElementById('companySearchAddress');
    const companyNameInput = document.querySelector('input[name="companyName"]');

    function toggleCompanyModal(show) {
      if (show) {
        companyModal.classList.remove('hidden');
      } else {
        companyModal.classList.add('hidden');
      }
    }

    btnCompanySearch.addEventListener('click', (e) => {
      e.preventDefault();
      const addr = addressInput.value.trim();
      if (!addr) {
        alert('先に住所を入力してください。');
        return;
      }
      toggleCompanyModal(true);
      executeCompanySearch(addr);
    });

    closeCompanyModal.addEventListener('click', () => toggleCompanyModal(false));
    companyModalBackdrop.addEventListener('click', () => toggleCompanyModal(false));

    function executeCompanySearch(address) {
      // 検索住所を表示
      companySearchAddress.innerHTML = '<span class="font-bold">検索住所:</span> ' + address;

      // ローディング表示
      companyResultList.innerHTML = '';
      companySearchLoading.classList.remove('hidden');

      fetch(`/api/companies/search-by-address?address=${encodeURIComponent(address)}`)
        .then(res => {
          if (!res.ok) throw new Error('検索に失敗しました');
          return res.json();
        })
        .then(data => {
          companySearchLoading.classList.add('hidden');
          companyResultList.innerHTML = '';

          if (!data || data.length === 0) {
            companyResultList.innerHTML =
              '<div class="text-gray-500 p-4 text-center text-base">'
              + '<span class="material-symbols-outlined text-3xl mb-2 block">search_off</span>'
              + '企業名が見つかりませんでした</div>';
            return;
          }

          data.forEach(item => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className =
              'w-full text-left px-4 py-3 rounded-lg text-gray-800 hover:bg-primary/10 '
              + 'transition-colors border border-transparent hover:border-primary/30 flex flex-col gap-1';

            // 企業名
            const nameSpan = document.createElement('span');
            nameSpan.className = 'text-base font-bold';
            nameSpan.textContent = item.companyName;
            button.appendChild(nameSpan);

            // メタ情報（ソース・住所）
            const metaDiv = document.createElement('div');
            metaDiv.className = 'flex items-center gap-2 text-xs text-gray-500';

            // ソースバッジ
            const badge = document.createElement('span');
            badge.className = item.source === 'データベース'
              ? 'px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-bold'
              : 'px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-bold';
            badge.textContent = item.source;
            metaDiv.appendChild(badge);

            // 住所（あれば）
            if (item.address) {
              const addrSpan = document.createElement('span');
              addrSpan.textContent = item.address;
              metaDiv.appendChild(addrSpan);
            }

            // 法人番号（あれば）
            if (item.corporateNumber) {
              const corpSpan = document.createElement('span');
              corpSpan.textContent = '法人番号: ' + item.corporateNumber;
              metaDiv.appendChild(corpSpan);
            }

            button.appendChild(metaDiv);

            // クリック時の動作: 企業名を自動入力
            button.addEventListener('click', () => {
              companyNameInput.value = item.companyName;
              toggleCompanyModal(false);
            });

            companyResultList.appendChild(button);
          });
        })
        .catch(err => {
          console.error(err);
          companySearchLoading.classList.add('hidden');
          companyResultList.innerHTML =
            '<div class="text-red-500 p-4 text-center text-base">'
            + '<span class="material-symbols-outlined text-3xl mb-2 block">error</span>'
            + '検索中にエラーが発生しました</div>';
        });
    }
  </script>
</body>

</html>
