# アプリケーション吁E
spring.application.name=company-directory
spring.config.import=optional:file:.env[.properties]

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.maintenance-mode=false

# --- External API Keys ---
app.houjin-bangou.app-id=${HOJIN_BANGOU_APP_ID}
app.gemini.api-key=${GEMINI_API_KEY}

# Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG



# --- 画面の CSS・フォント（アプリに同梱）をブラウザに長くキャッシュさせる ---
# ファイルの中身から作ったハッシュを URL に付けるので（例: app-1a2b3c.css）、中身が変われば URL も変わる
spring.web.resources.chain.strategy.content.enabled=true
# max-age=30d は静的ファイル全部に効くので、画像にもハッシュを付ける（差し替えたら URL が変わり、古いものが残らない）
spring.web.resources.chain.strategy.content.paths=/css/**,/images/**
spring.web.resources.cache.cachecontrol.max-age=30d

# --- ゴミ箱の自動パージ（30 日を過ぎたものを削除）---
# 毎日 3:00 の定期実行に加えて、起動したときにも 1 回（起動が終わって少し待ってから、裏で）行う。
# 止めたいときは false にする
app.trash.purge-on-startup=true
app.trash.purge-on-startup-delay=10s
