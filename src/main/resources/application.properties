# アプリケーション吁E
spring.application.name=company-directory
spring.config.import=optional:file:.env[.properties]

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.maintenance-mode=false

# --- External API Keys ---
app.houjin-bangou.app-id=${HOJIN_BANGOU_APP_ID}
app.gemini.api-key=${GEMINI_API_KEY}

# Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG



# --- 画面の CSS・フォント（アプリに同梱）をブラウザに長くキャッシュさせる ---
# ファイルの中身から作ったハッシュを URL に付けるので（例: app-1a2b3c.css）、中身が変われば URL も変わる
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**
spring.web.resources.cache.cachecontrol.max-age=30d
