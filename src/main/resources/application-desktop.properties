# =====================================================================
# デスクトップ版（jpackage で作った Windows アプリ）だけで使う設定。
# DesktopLauncher が「desktop」プロファイルを付けて起動したときに、
# application.properties の上に重ねて読み込まれる。Web 版には影響しない。
# =====================================================================

# --- 画面はこの PC からだけ開ける（社内 LAN などの他の PC からは見えない）---
server.address=127.0.0.1
# server.port は DesktopLauncher が決める（18080。使われていれば空いている番号）

# --- 外部 API のキーは無くても起動できるように（無いときはその機能だけ使えない）---
app.houjin-bangou.app-id=${HOJIN_BANGOU_APP_ID:}
app.gemini.api-key=${GEMINI_API_KEY:}

# --- 起動を速くする ---
# 画面に SQL やデバッグログを大量に出すと、起動も動作も遅くなるので止める
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.root=INFO
# ログイン状態を保持する（remember-me）のトークンを INFO で出すログがあるので、デスクトップ版では出さない
# （ログはファイルに残るため。トークンがあれば、パスワード無しでログインできてしまう）
logging.level.com.example.company_directory.filter.RememberMeLoggingFilter=WARN
logging.level.com.example.company_directory.config.JpaPersistentTokenRepository=WARN
# 起動時のバナーを出さない
spring.main.banner-mode=off
# 使うときに初めて作る（遅延初期化）。効果は docs/desktop-app.md の計測を参照
spring.main.lazy-initialization=true
# Spring Data のリポジトリも遅延で作る
spring.data.jpa.repositories.bootstrap-mode=lazy

# --- DB（Supabase）---
# 1 人で使うアプリなので接続は少なくてよい（Supabase 無料プランの接続数を使い切らない）
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# つながらないときに 30 秒も待たせない
spring.datasource.hikari.connection-timeout=10000

# --- ログはファイルにも出す（場所は DesktopLauncher が logging.file.name で渡す）---
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5
