# =====================================================================
# ローカル開発用: PostgreSQL とアプリを Docker でまとめて起動する。
#   docker compose up --build
#   → http://localhost:8080/login
#
# 本番の Supabase ではなく、この PC の中だけの PostgreSQL を使う（データは pg_data に残る）。
# 秘密の値はここに書かず、リポジトリ直下の .env から読む。.env に次を足してください:
#   LOCAL_DB_PASSWORD=<ローカル DB 用に自分で決めたパスワード>
#   （HOJIN_BANGOU_APP_ID・GEMINI_API_KEY も .env にあれば使う。無ければその機能だけ使えない）
# .env の SPRING_DATASOURCE_*（Supabase の接続先）は、ここでは使わない。
# =====================================================================
services:
  # --- 1. データベース (PostgreSQL) ---
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: company_directory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?.env に LOCAL_DB_PASSWORD を書いてください}
    ports:
      # この PC からだけつなげる（DBeaver などで中を見たいとき用）
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data # コンテナを消してもデータが残る
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_directory"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 2. アプリケーション (Java) ---
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/company_directory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?.env に LOCAL_DB_PASSWORD を書いてください}
      HOJIN_BANGOU_APP_ID: ${HOJIN_BANGOU_APP_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy # DB が使えるようになってからアプリを起動する

volumes:
  pg_data:
